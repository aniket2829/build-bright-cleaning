<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Build Bright Cleaning</title>
  <!--
    The wordmark glyph from components/icons.tsx (Mark): a doorway with light
    crossing the threshold. Standalone file, so the amber and the dusk ground
    are written out rather than inherited: currentColor would render black.
    The glyph is authored in a 24-unit box; the transform seats it in a 32-unit
    canvas with the padding a tab icon needs.
  -->
  <rect width="32" height="32" rx="7" fill="#0a111c" />
  <g transform="translate(2.2 2.4) scale(1.15)" fill="none" stroke="#e8a33d">
    <path
      d="M5 21V6.2a1 1 0 01.6-.92l6-2.6a1 1 0 011.4.92V21"
      fill="#e8a33d"
      fill-opacity="0.28"
      stroke="none"
    />
    <path
      d="M5 21V6.2a1 1 0 01.6-.92l6-2.6a1 1 0 011.4.92V21"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
    <path d="M13 21l6-4.6V21z" fill="#e8a33d" stroke="none" />
    <path d="M9.6 12.4v2.2" stroke-width="1.6" stroke-linecap="round" />
  </g>
</svg>
